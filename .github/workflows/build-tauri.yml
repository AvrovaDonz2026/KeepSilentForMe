name: Build Tauri desktop packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            bundles: appimage,deb
          - platform: windows
            runner: windows-latest
            # Keep the Windows artifact on the NSIS path. MSI uses the WiX
            # toolchain and can fail independently on a hosted runner.
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend and Tauri dependencies
        run: npm ci

      - name: Validate audio manifest
        run: node scripts/validate-audio.mjs

      - name: Print Windows build tool versions
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: keep-silent-for-me-${{ matrix.platform }}-[arch]-[bundle]
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
